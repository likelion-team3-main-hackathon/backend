spring:
  application:
    name: tri-lion-health
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mcc_wellness?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:mcc_user}
    password: ${SPRING_DATASOURCE_PASSWORD:mcc_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

springdoc:
  swagger-ui.path: /swagger-ui.html

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-must-be-at-least-32-bytes}
    issuer: tri-lion-health
    access-seconds: 1800
    refresh-seconds: 1209600
  google:
    client-id: ${GOOGLE_CLIENT_ID:local-client}
    issuer: ${GOOGLE_ISSUER:https://accounts.google.com}
    fake-enabled: ${GOOGLE_FAKE_ENABLED:true}
  auth:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    private-bucket: ${OBJECT_STORAGE_BUCKET_PRIVATE:health-private}
    public-bucket: ${OBJECT_STORAGE_BUCKET_PUBLIC:health-public}
  ai:
    provider: ${AI_PROVIDER:fake}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:180}
    debug-log-responses: ${AI_DEBUG_LOG_RESPONSES:false}
    models:
      analysis: ${GEMINI_MODEL_ANALYSIS:gemini-3.6-flash}
      routine: ${GEMINI_MODEL_ROUTINE:gemini-3.6-flash}
      coaching: ${GEMINI_MODEL_COACHING:gemini-3.5-flash-lite}
    prompts:
      document-extraction-version: ${AI_PROMPT_DOCUMENT_EXTRACTION_VERSION:document-v1-multi}
      health-analysis-version: ${AI_PROMPT_HEALTH_ANALYSIS_VERSION:health-v3-multi-document}
      routine-generation-version: ${AI_PROMPT_ROUTINE_GENERATION_VERSION:routine-v6-day-summaries}
      record-coaching-version: ${AI_PROMPT_RECORD_COACHING_VERSION:coaching-v2}
    gemini:
      api-key: ${GOOGLE_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    limits:
      enabled: ${AI_RATE_LIMIT_ENABLED:true}
      zone: ${AI_RATE_LIMIT_ZONE:Asia/Seoul}
      global-per-minute: ${AI_GLOBAL_REQUESTS_PER_MINUTE:30}
      global-per-day: ${AI_GLOBAL_REQUESTS_PER_DAY:100}
      health-analysis-per-user-day: ${AI_HEALTH_ANALYSIS_PER_USER_DAY:3}
      routine-generation-per-user-day: ${AI_ROUTINE_GENERATION_PER_USER_DAY:5}
      routine-adjustment-per-user-day: ${AI_ROUTINE_ADJUSTMENT_PER_USER_DAY:5}
      record-coaching-per-user-day: ${AI_RECORD_COACHING_PER_USER_DAY:20}

---
spring:
  config.activate.on-profile: local

app:
  auth:
    refresh-cookie-secure: false
  adapters.fake: true

---
spring:
  config.activate.on-profile: test
  datasource:
    url: jdbc:h2:mem:health;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa.hibernate.ddl-auto: create-drop
  flyway.enabled: false

app:
  auth:
    refresh-cookie-secure: false
  adapters.fake: true
