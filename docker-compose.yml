services:
  app:
    build: .
    ports: ["${APP_PORT:-8080}:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_URL: redis://redis:6379
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET_PRIVATE: ${OBJECT_STORAGE_BUCKET_PRIVATE}
      OBJECT_STORAGE_BUCKET_PUBLIC: ${OBJECT_STORAGE_BUCKET_PUBLIC}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_ISSUER: ${GOOGLE_ISSUER:-https://accounts.google.com}
      GOOGLE_FAKE_ENABLED: ${GOOGLE_FAKE_ENABLED:-true}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_MODEL_ANALYSIS: ${GEMINI_MODEL_ANALYSIS:-gemini-3.5-flash-lite}
      GEMINI_MODEL_ROUTINE: ${GEMINI_MODEL_ROUTINE:-gemini-3.5-flash-lite}
      GEMINI_MODEL_COACHING: ${GEMINI_MODEL_COACHING:-gemini-3.5-flash-lite}
      AI_PROMPT_DOCUMENT_EXTRACTION_VERSION: ${AI_PROMPT_DOCUMENT_EXTRACTION_VERSION:-document-v3-iso-measured-date}
      AI_PROMPT_HEALTH_ANALYSIS_VERSION: ${AI_PROMPT_HEALTH_ANALYSIS_VERSION:-health-v3-multi-document}
      AI_PROMPT_ROUTINE_GENERATION_VERSION: ${AI_PROMPT_ROUTINE_GENERATION_VERSION:-routine-v7-explicit-date-range}
      AI_PROMPT_RECORD_COACHING_VERSION: ${AI_PROMPT_RECORD_COACHING_VERSION:-coaching-v2}
      AI_PROMPT_MEAL_PHOTO_VERSION: ${AI_PROMPT_MEAL_PHOTO_VERSION:-meal-photo-v1}
      AI_PROMPT_POSE_ANALYSIS_VERSION: ${AI_PROMPT_POSE_ANALYSIS_VERSION:-pose-analysis-v2}
      GEMINI_MODEL_MEAL_PHOTO: ${GEMINI_MODEL_MEAL_PHOTO:-gemini-3.5-flash-lite}
      GEMINI_MODEL_POSE_ANALYSIS: ${GEMINI_MODEL_POSE_ANALYSIS:-gemini-3.5-flash-lite}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-5}
      AI_READ_TIMEOUT_SECONDS: ${AI_READ_TIMEOUT_SECONDS:-180}
      AI_DEBUG_LOG_RESPONSES: ${AI_DEBUG_LOG_RESPONSES:-false}
      AI_RATE_LIMIT_ENABLED: ${AI_RATE_LIMIT_ENABLED:-true}
      AI_RATE_LIMIT_ZONE: ${AI_RATE_LIMIT_ZONE:-Asia/Seoul}
      AI_GLOBAL_REQUESTS_PER_MINUTE: ${AI_GLOBAL_REQUESTS_PER_MINUTE:-30}
      AI_GLOBAL_REQUESTS_PER_DAY: ${AI_GLOBAL_REQUESTS_PER_DAY:-100}
      AI_HEALTH_ANALYSIS_PER_USER_DAY: ${AI_HEALTH_ANALYSIS_PER_USER_DAY:-3}
      AI_ROUTINE_GENERATION_PER_USER_DAY: ${AI_ROUTINE_GENERATION_PER_USER_DAY:-5}
      AI_ROUTINE_ADJUSTMENT_PER_USER_DAY: ${AI_ROUTINE_ADJUSTMENT_PER_USER_DAY:-5}
      AI_RECORD_COACHING_PER_USER_DAY: ${AI_RECORD_COACHING_PER_USER_DAY:-20}
      JAVA_OPTS: ${JAVA_OPTS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [wellness]
  mysql:
    image: mysql:8.4
    ports: ["${MYSQL_PORT:-3306}:3306"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD && mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'USE ${MYSQL_DATABASE}'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [wellness]
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [wellness]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports: ["${MINIO_API_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [wellness]
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PRIVATE_BUCKET: ${OBJECT_STORAGE_BUCKET_PRIVATE}
      PUBLIC_BUCKET: ${OBJECT_STORAGE_BUCKET_PUBLIC}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$PRIVATE_BUCKET && mc mb --ignore-existing local/$$PUBLIC_BUCKET"]
    networks: [wellness]
volumes:
  mysql-data:
  minio-data:
networks:
  wellness:
